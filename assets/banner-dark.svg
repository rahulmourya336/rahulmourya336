<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Rahul Mourya, Full Stack Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="60%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <ellipse cx="1010" cy="70" rx="330" ry="240" fill="url(#glowA)"/>
  <ellipse cx="190" cy="320" rx="300" ry="220" fill="url(#glowB)"/>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="80" y="118" fill="#7DD3FC" font-size="17" font-weight="600" letter-spacing="4.5">FULL STACK ENGINEER</text>
    <text x="80" y="196" fill="url(#name)" font-size="72" font-weight="800" letter-spacing="-1.5">Rahul Mourya</text>
    <rect x="80" y="222" width="420" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="80" y="268" fill="#94A3B8" font-size="21" font-weight="400">Shipping web products since 2018.</text>
    <text x="80" y="300" fill="#64748B" font-size="18" font-weight="400">React · TypeScript · Python · AWS</text>
  </g>

  <g opacity="0.5">
    <circle cx="1080" cy="248" r="5" fill="#38BDF8"/>
    <circle cx="1110" cy="248" r="5" fill="#818CF8"/>
    <circle cx="1140" cy="248" r="5" fill="#A78BFA"/>
  </g>
</svg>

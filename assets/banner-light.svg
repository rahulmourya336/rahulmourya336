<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Rahul Mourya, Full Stack Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#475569" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <ellipse cx="1010" cy="70" rx="330" ry="240" fill="url(#glowA)"/>
  <ellipse cx="190" cy="320" rx="300" ry="220" fill="url(#glowB)"/>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="80" y="118" fill="#0284C7" font-size="17" font-weight="600" letter-spacing="4.5">FULL STACK ENGINEER</text>
    <text x="80" y="196" fill="url(#name)" font-size="72" font-weight="800" letter-spacing="-1.5">Rahul Mourya</text>
    <rect x="80" y="222" width="420" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="80" y="268" fill="#475569" font-size="21" font-weight="400">Shipping web products since 2018.</text>
    <text x="80" y="300" fill="#64748B" font-size="18" font-weight="400">React · TypeScript · Python · AWS</text>
  </g>

  <g opacity="0.7">
    <circle cx="1080" cy="248" r="5" fill="#0EA5E9"/>
    <circle cx="1110" cy="248" r="5" fill="#6366F1"/>
    <circle cx="1140" cy="248" r="5" fill="#8B5CF6"/>
  </g>
</svg>
